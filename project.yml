name: HourBack
options:
  bundleIdPrefix: com.aauthorizedd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  HourBack:
    type: application
    platform: iOS
    sources:
      - path: HourBack
        excludes:
          - Info.plist
          - HourBack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aauthorizedd.hourback
        PRODUCT_NAME: HourBack
        INFOPLIST_FILE: HourBack/Info.plist
        CODE_SIGN_ENTITLEMENTS: HourBack/HourBack.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Uncomment and set this when you have an Apple Developer Team ID.
        # DEVELOPMENT_TEAM: XXXXXXXXXX
    dependencies:
      - target: HourBackShield
        embed: true
  HourBackShield:
    type: app-extension
    platform: iOS
    sources:
      - path: HourBackShield
        excludes:
          - Info.plist
          - HourBackShield.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aauthorizedd.hourback.shield
        PRODUCT_NAME: HourBackShield
        INFOPLIST_FILE: HourBackShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: HourBackShield/HourBackShield.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # DEVELOPMENT_TEAM: XXXXXXXXXX
  HourBackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HourBackTests
    dependencies:
      - target: HourBack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aauthorizedd.hourback.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HourBack.app/HourBack"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HourBack:
    build:
      targets:
        HourBack: all
        HourBackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HourBackTests
